<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d5fa8"/><stop offset="1" stop-color="#0c2f5c"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3f6fa"/>
    </linearGradient>
    <pattern id="g1" width="24" height="24" patternUnits="userSpaceOnUse" x="212" y="252">
      <path d="M24 0V24M0 24H24" stroke="#f4cfcf" stroke-width="2" fill="none"/>
    </pattern>
    <pattern id="g5" width="120" height="120" patternUnits="userSpaceOnUse" x="212" y="252">
      <path d="M120 0V120M0 120H120" stroke="#e8a0a0" stroke-width="4" fill="none"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#04182f" flood-opacity=".45"/>
    </filter>
    <clipPath id="paper"><rect x="212" y="252" width="600" height="520" rx="44"/></clipPath>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <g filter="url(#shadow)"><rect x="212" y="252" width="600" height="520" rx="44" fill="url(#sheet)"/></g>
  <g clip-path="url(#paper)">
    <rect x="212" y="252" width="600" height="520" fill="url(#g1)"/>
    <rect x="212" y="252" width="600" height="520" fill="url(#g5)"/>
  </g>
  <!-- one heartbeat: P wave, tall R spike breaking out of the sheet, deep S, T wave -->
  <path d="M150 560 H300 Q322 524 344 560 H404 L432 588 L486 184 L548 690 L586 560 H632 Q680 474 728 560 H874"
        fill="none" stroke="#ffffff" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
  <path d="M150 560 H300 Q322 524 344 560 H404 L432 588 L486 184 L548 690 L586 560 H632 Q680 474 728 560 H874"
        fill="none" stroke="#d8343f" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
